name: 🧪 test (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
      # --ignore-scripts: esbuild's postinstall requires Node >= 18, but it's
      # only needed for bundling, not for running the test suite
      - run: npm install --ignore-scripts
      - run: find ./node_modules/eslint -type f -name '*.js' -exec sed -i 's/\bconst\b/var/g; s/\blet\b/var/g' {} +
      - name: 🧪 Test
        run: npm test
